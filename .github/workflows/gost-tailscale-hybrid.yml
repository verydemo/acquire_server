name: Shadowsocks + Tailscale Hybrid Node

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Keep-alive duration in hours'
        required: false
        default: '5'
      hostname:
        description: 'Tailscale hostname prefix'
        required: false
        default: 'gh-hybrid'
  schedule:
    - cron: "0 */5 * * *"
  repository_dispatch:

jobs:
  hybrid-node:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: System Information
        run: |
          echo "=== System Info ==="
          uname -a
          cat /etc/os-release
          df -h
          free -h
          nproc

      - name: Configure SSH Access
        env:
          GH_SSH_ROOT_PASS: ${{ secrets.GH_SSH_ROOT_PASS }}
          GH_SSH_USER_PASS: ${{ secrets.GH_SSH_USER_PASS }}
        run: |
          # Create user 'jiro' with configurable or default password
          USER_PASS="${GH_SSH_USER_PASS:-123456}"
          sudo useradd -m -s /bin/bash jiro 2>/dev/null || true
          echo "jiro:${USER_PASS}" | sudo chpasswd
          sudo sh -c 'echo "jiro ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'

          # Configure root login
          ROOT_PASS="${GH_SSH_ROOT_PASS:-nihao}"
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "root:${ROOT_PASS}" | sudo chpasswd

          echo "SSH configured: ssh root@localhost or ssh jiro@localhost"

      - name: Configure Firewall
        run: |
          # Open ports for Shadowsocks
          sudo apt-get update
          sudo apt-get install -y ufw
          sudo ufw allow 22/tcp
          sudo ufw allow 8888/tcp
          sudo ufw allow 8888/udp
          echo "y" | sudo ufw enable || true
          sudo ufw status

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          echo "Tailscale installed: $(tailscale version)"

      - name: Deploy Shadowsocks Container
        id: shadowsocks
        env:
          SS_PASSWORD: '123456'
        run: |
          # Get public IP
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s icanhazip.com || curl -s ipinfo.io/ip)
          echo "Public IP: ${PUBLIC_IP}"

          # Run Shadowsocks container
          docker run -d \
            --name shadowsocks \
            --restart unless-stopped \
            -p 8888:8888/tcp \
            -p 8888:8888/udp \
            ghcr.io/shadowsocks/ssserver-rust:latest \
            ssserver -s "0.0.0.0:8888" \
            -m "aes-256-gcm" \
            -k "${SS_PASSWORD}"

          sleep 3

          # Verify container is running
          if docker ps | grep -q shadowsocks; then
            echo "Shadowsocks container started successfully"
            echo "ss_running=true" >> $GITHUB_OUTPUT
            echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
          else
            echo "::error::Failed to start Shadowsocks container"
            docker logs shadowsocks
            echo "ss_running=false" >> $GITHUB_OUTPUT
          fi

          # Show container status
          docker ps
          docker logs shadowsocks 2>&1 | tail -20

      - name: Connect to Tailscale
        id: tailscale
        env:
          TS_KEY: ${{ secrets.TS_KEY }}
          TS_HOSTNAME: ${{ github.event.inputs.hostname || 'gh-hybrid' }}
        run: |
          if [ -z "$TS_KEY" ]; then
            echo "::warning::TS_KEY secret not configured. Skipping Tailscale connection."
            echo "tailscale_connected=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          sudo tailscale up --authkey=${TS_KEY} \
            --hostname=${TS_HOSTNAME} \
            --accept-routes \
            --ssh

          TS_IP=$(tailscale ip -4)
          echo "tailscale_connected=true" >> $GITHUB_OUTPUT
          echo "tailscale_ip=${TS_IP}" >> $GITHUB_OUTPUT

          echo "=========================================="
          echo "Tailscale Connected!"
          echo "Hostname: ${TS_HOSTNAME}"
          echo "Tailscale IP: ${TS_IP}"
          echo "=========================================="

      - name: Display Connection Info
        run: |
          echo ""
          echo "=========================================="
          echo "  HYBRID NODE READY"
          echo "=========================================="
          echo ""
          echo "SSH Access:"
          echo "  - ssh root@localhost (password: configured via secrets)"
          echo "  - ssh jiro@localhost (password: configured via secrets)"
          echo ""
          echo "Shadowsocks VPN (Docker):"
          echo "  - Server: ${{ steps.shadowsocks.outputs.public_ip }}"
          echo "  - Port: 8888"
          echo "  - Cipher: aes-256-gcm"
          echo "  - Password: 123456"
          echo ""
          if [ "${{ steps.tailscale.outputs.tailscale_connected }}" = "true" ]; then
            echo "Tailscale Network:"
            echo "  - IP: ${{ steps.tailscale.outputs.tailscale_ip }}"
            echo "  - SSH: ssh root@${{ steps.tailscale.outputs.tailscale_ip }}"
          fi
          echo ""
          echo "Useful Commands:"
          echo "  - Check status: docker ps"
          echo "  - View logs: docker logs shadowsocks"
          echo "  - Restart: docker restart shadowsocks"
          echo "=========================================="

      - name: Keep Alive
        env:
          DURATION: ${{ github.event.inputs.duration || '5' }}
        run: |
          echo "Node online. Keeping alive for ${DURATION} hours..."
          sleep ${DURATION}h