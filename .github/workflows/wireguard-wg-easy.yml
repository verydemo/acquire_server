name: WireGuard wg-easy VPN Node

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Keep-alive duration in hours'
        required: false
        default: '5'
      hostname:
        description: 'WireGuard hostname prefix'
        required: false
        default: 'gh-wg-easy'
      password:
        description: 'Web UI password (default: admin)'
        required: false
        default: 'admin'
  schedule:
    - cron: "0 */5 * * *"
  repository_dispatch:

jobs:
  wireguard-node:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: System Information
        run: |
          echo "=== System Info ==="
          uname -a
          cat /etc/os-release
          df -h
          free -h
          nproc

      - name: Configure SSH Access
        env:
          GH_SSH_ROOT_PASS: ${{ secrets.GH_SSH_ROOT_PASS }}
          GH_SSH_USER_PASS: ${{ secrets.GH_SSH_USER_PASS }}
        run: |
          # Create user 'jiro' with configurable or default password
          USER_PASS="${GH_SSH_USER_PASS:-123456}"
          sudo useradd -m -s /bin/bash jiro 2>/dev/null || true
          echo "jiro:${USER_PASS}" | sudo chpasswd
          sudo sh -c 'echo "jiro ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'

          # Configure root login
          ROOT_PASS="${GH_SSH_ROOT_PASS:-nihao}"
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          echo "root:${ROOT_PASS}" | sudo chpasswd

          echo "SSH configured: ssh root@localhost or ssh jiro@localhost"

      - name: Install Docker
        run: |
          # Install Docker using official script
          curl -fsSL https://get.docker.com | sudo sh
          sudo usermod -aG docker $USER
          docker --version
          echo "Docker installed: $(docker --version)"

      - name: Configure Firewall
        run: |
          # Open ports for WireGuard and Web UI
          sudo apt-get update
          sudo apt-get install -y ufw
          sudo ufw allow 22/tcp
          sudo ufw allow 51820/udp
          sudo ufw allow 51821/tcp
          echo "y" | sudo ufw enable || true
          sudo ufw status

      - name: Deploy wg-easy
        id: wgeasy
        env:
          WG_PASSWORD: ${{ github.event.inputs.password || 'admin' }}
          WG_HOSTNAME: ${{ github.event.inputs.hostname || 'gh-wg-easy' }}
        run: |
          # Get public IP
          PUBLIC_IP=$(curl -s ifconfig.me || curl -s icanhazip.com || curl -s ipinfo.io/ip)
          echo "Public IP: ${PUBLIC_IP}"

          # Generate password hash using htpasswd
          sudo apt-get install -y apache2-utils
          PASSWORD_HASH=$(htpasswd -nbB admin "${WG_PASSWORD}" | cut -d: -f2)

          # Create config directory
          mkdir -p ~/.wg-easy

          # Run wg-easy container
          docker run -d \
            --name wg-easy \
            -e PASSWORD_HASH="${PASSWORD_HASH}" \
            -e WG_HOST=${PUBLIC_IP} \
            -e WG_PORT=51820 \
            -e WG_DEFAULT_ADDRESS=10.8.0.x \
            -e WG_DEFAULT_DNS=1.1.1.1 \
            -v ~/.wg-easy:/etc/wireguard \
            -p 51820:51820/udp \
            -p 51821:51821/tcp \
            --cap-add=NET_ADMIN \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            ghcr.io/wg-easy/wg-easy:latest

          sleep 5

          # Verify container is running
          if docker ps | grep -q wg-easy; then
            echo "wg-easy container started successfully"
            echo "wg_running=true" >> $GITHUB_OUTPUT
            echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
          else
            echo "::error::Failed to start wg-easy container"
            docker logs wg-easy
            echo "wg_running=false" >> $GITHUB_OUTPUT
          fi

          # Show container status
          docker ps
          docker logs wg-easy 2>&1 | tail -20

      - name: Display Connection Info
        run: |
          echo ""
          echo "=========================================="
          echo "  WIREGUARD WG-EASY NODE READY"
          echo "=========================================="
          echo ""
          echo "SSH Access:"
          echo "  - ssh root@localhost (password: configured via secrets)"
          echo "  - ssh jiro@localhost (password: configured via secrets)"
          echo ""
          echo "WireGuard VPN (wg-easy):"
          echo "  - VPN Port: 51820/UDP"
          echo "  - Web UI: http://${{ steps.wgeasy.outputs.public_ip }}:51821"
          echo "  - Username: admin"
          echo "  - Password: ${WD_PASSWORD:-admin}"
          echo ""
          echo "Client Setup:"
          echo "  1. Open Web UI in browser"
          echo "  2. Click '+ New' to create a client"
          echo "  3. Scan QR code or download config file"
          echo "  4. Import into WireGuard app"
          echo ""
          echo "WireGuard Apps:"
          echo "  - iOS/Android: Search 'WireGuard' in App Store"
          echo "  - Windows/macOS: https://wireguard.com/install"
          echo ""
          echo "Useful Commands:"
          echo "  - Check status: docker ps"
          echo "  - View logs: docker logs wg-easy"
          echo "  - Show peers: docker exec wg-easy wg show"
          echo "=========================================="

      - name: Keep Alive
        env:
          DURATION: ${{ github.event.inputs.duration || '5' }}
        run: |
          echo "Node online. Keeping alive for ${DURATION} hours..."
          sleep ${DURATION}h