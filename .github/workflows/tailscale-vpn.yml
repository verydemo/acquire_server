name: Tailscale Node

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"
  repository_dispatch:

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    
    steps:
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh
        
      - name: Connect to Tailscale
        env:
          TS_KEY: ${{ secrets.TS_KEY }}
        run: |
          tailscale up --authkey=${TS_KEY} \
            --hostname=gh-node \
            --accept-routes
          
          echo "Connected!"
          echo "Hostname: gh-node"
          echo "Tailscale IP: $(tailscale ip -4)"
          tailscale status
          
      - name: Keep Alive
        run: |
          echo "Node online. Use 'tailscale ping gh-node' to connect."
          sleep 5h
