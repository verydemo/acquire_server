name: ubuntu-arm64
on:  
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-arm64

jobs:
  build:
    # 使用GitHub托管的ARM64运行器（需确认当前可用性）
    runs-on: [self-hosted, ARM64, Linux] 
    # 若托管运行器不可用，可用以下Docker跨平台方案替代：
    # runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     platform: [linux/arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Buildx (跨平台构建)
      uses: docker/setup-buildx-action@v2
      with:
        platform: linux/arm64  # 指定目标平台[2,4](@ref)

    - name: Build ARM64 image
      uses: docker/build-push-action@v3
      with:
        context: .
        platforms: linux/arm64
        run: |
            useradd -m -s /bin/bash jiro && echo 'jiro:zhangjl22222@' | chpasswd
            sh -c 'echo "jiro    ALL=(ALL:ALL) ALL" >> /etc/sudoers'
            wget https://github.com/ginuerzh/gost/releases/download/v2.12.0/gost_2.12.0_linux_arm64.tar.gz
            gunzip gost_2.12.0_linux_arm64.tar.gz && mv gost_2.12.0_linux_arm64 gost && chmod 777 gost
            ${{ vars.GOST_SHELL_ARM64 }}
            tail
