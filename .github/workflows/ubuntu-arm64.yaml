name: ubuntu-arm64
on:  
  workflow_dispatch:
  repository_dispatch:
    types:
      - webhook-arm64

jobs:
  arm64_job:
    runs-on: ubuntu-22.04
    name: Build on ubuntu-22.04 aarch64
    steps:
      - uses: actions/checkout@v3
      - uses: uraimo/run-on-arch-action@master
        name: Run commands
        id: runcmd
        with:
          arch: aarch64
          distro: ubuntu22.04

          # Not required, but speeds up builds
          #githubToken: ${{ github.token }}

          run: |
            uname -a
            echo ::set-output name=uname::$(uname -a)
             useradd -m -s /bin/bash jiro && echo 'jiro:zhangjl22222@' | chpasswd
             sh -c 'echo "jiro    ALL=(ALL:ALL) ALL" >> /etc/sudoers'
             wget https://github.com/ginuerzh/gost/releases/download/v2.12.0/gost_2.12.0_linux_arm64.tar.gz
             gunzip gost_2.12.0_linux_arm64.tar.gz && mv gost_2.12.0_linux_arm64 gost && chmod 777 gost
             ${{vars.GOST_SHELL_ARM64}}
             tail
