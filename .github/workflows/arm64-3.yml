name: arm64-3
on:  
  workflow_dispatch:

      
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
          
      - name: proxy 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # sudo systemctl stop docker
          # sudo mkdir -p /mnt/lib/docker
          # echo '{ "exec-opts": ["native.cgroupdriver=cgroupfs"], "cgroup-parent": "/actions_job","data-root": "/mnt/lib/docker"}' | sudo tee /etc/docker/daemon.json > /dev/null 
          # sudo systemctl daemon-reload
          # sudo systemctl start docker
          sudo useradd -m -s /bin/bash jiro && echo 'jiro:123456' | sudo chpasswd
          sudo sh -c 'echo "jiro    ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'
          sudo whoami
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sudo sh -c 'echo "root:nihao" | chpasswd'
          wget https://github.com/ginuerzh/gost/releases/download/v2.12.0/gost_2.12.0_linux_arm64.tar.gz
          tar zxvf gost_2.12.0_linux_arm64.tar.gz
          ${{vars.GOST_SHELL_ARM64_2}}
          tail
